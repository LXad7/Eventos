<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prog I · Treino</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface2:#eef1f5; --text:#1b1f24; --muted:#5d6672;
  --border:#d9dee5; --accent:#2457c5; --accent-weak:#e3ebfb;
  --ok:#1d7a3e; --ok-bg:#e4f4ea; --bad:#b3261e; --bad-bg:#fbe8e6; --warn:#8a5a00; --warn-bg:#fdf1d8;
  --code-bg:#f2f4f7; --code-text:#1b1f24;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121417; --surface:#1b1e23; --surface2:#23272e; --text:#e6e8eb; --muted:#9aa3ae;
    --border:#30353d; --accent:#7aa2ff; --accent-weak:#1f2a44;
    --ok:#5fd28a; --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1a18; --warn:#f5c35b; --warn-bg:#3a2e12;
    --code-bg:#15181c; --code-text:#e6e8eb;
  }
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1b1e23; --surface2:#23272e; --text:#e6e8eb; --muted:#9aa3ae;
  --border:#30353d; --accent:#7aa2ff; --accent-weak:#1f2a44;
  --ok:#5fd28a; --ok-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1a18; --warn:#f5c35b; --warn-bg:#3a2e12;
  --code-bg:#15181c; --code-text:#e6e8eb;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 64px}
header{padding:20px 0 8px}
header h1{margin:0;font-size:1.45rem}
header p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;padding:10px 0;border-bottom:1px solid var(--border);overflow-x:auto}
.tabs button{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:999px;font:inherit;font-size:.95rem;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
section.tab{display:none;padding-top:16px}
section.tab.on{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:0 0 16px}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.qnum{font-weight:700}
.chip{font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.chip-o{background:var(--accent-weak);color:var(--accent);border-color:transparent}
.chip-n{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.qtxt{margin:6px 0}
.qask{margin:10px 0 6px;font-weight:600}
pre{margin:0;font:13.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;white-space:pre;overflow-x:auto}
pre.code{background:var(--code-bg);color:var(--code-text);border:1px solid var(--border);border-radius:8px;padding:12px;margin:8px 0}
code{font:0.9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface2);padding:1px 4px;border-radius:4px}
ol.opts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.opt{display:flex;gap:10px;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--surface)}
.opt .letter{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-weight:700;font-size:.85rem}
.optbody{min-width:0;flex:1}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .letter{background:var(--ok);color:#fff}
.opt.bad .why{color:var(--muted)}
.opt.chosen-bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.chosen-bad .letter{background:var(--bad);color:#fff}
.why{font-size:.88rem;margin-top:6px}
.opt.ok .why{color:var(--ok)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.tag.mine{background:var(--accent);color:#fff}
.exp{margin-top:12px;padding:12px;border-radius:8px;background:var(--surface2);font-size:.95rem}
.exp strong:first-child{display:block;margin-bottom:4px}
.exp ul,.exp ol{margin:6px 0;padding-left:20px}
.hidden-sol .opt.ok{border-color:var(--border);background:var(--surface)}
.hidden-sol .opt.ok .letter{background:var(--surface2);color:var(--text)}
.hidden-sol .why,.hidden-sol .exp{display:none}
.reveal{display:none;margin-top:10px}
.hidden-sol .reveal{display:inline-block}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}
.toolbar label{display:flex;gap:6px;align-items:center;font-size:.95rem}
select,input[type=number]{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.btn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:9px 16px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.form{display:grid;gap:12px;max-width:520px}
.form label{display:grid;gap:4px;font-size:.95rem}
.form .row{display:flex;gap:8px;align-items:center}
.note{font-size:.88rem;color:var(--muted)}
.banner{border:1px solid var(--warn);background:var(--warn-bg);color:var(--text);border-radius:8px;padding:12px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.runbar{position:sticky;top:57px;z-index:4;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:4px 10px;border-radius:6px;background:var(--surface2)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
label.ans{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;background:var(--surface)}
label.ans:hover{border-color:var(--accent)}
label.ans.sel{border-color:var(--accent);background:var(--accent-weak)}
label.ans input{margin-top:4px;flex:0 0 auto}
.navrow{display:flex;justify-content:space-between;gap:8px;margin:12px 0}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.grid button{width:38px;height:38px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:.85rem;cursor:pointer}
.grid button.done{background:var(--surface2);border-color:var(--muted)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.grid button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.grid button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0 16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px}
.stat .v{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:.82rem;color:var(--muted)}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
.cab h2{font-size:1.1rem;margin:0 0 8px}
.cab p,.cab li{font-size:.95rem}
.cab ul{padding-left:20px;margin:6px 0}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.theme{flex:0 0 auto}
.theme button{font:inherit;font-size:.85rem;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;padding:4px 8px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
  <h1>Programação I · Treino offline</h1>
  <p>Prova Escrita 2 — correção das 18 perguntas do teste de treino + 15 perguntas novas do mesmo estilo. Funciona sem internet.</p>
  </div>
  <div class="theme"><button id="themeBtn" type="button">Tema</button></div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="correcao" class="on">Correção</button>
  <button data-tab="teste">Fazer teste</button>
  <button data-tab="cabula">Cábula</button>
  <button data-tab="historico">Histórico</button>
</nav>

<section class="tab on" id="tab-correcao">
  <div class="toolbar">
    <label>Mostrar
      <select id="f-src">
        <option value="orig">Teste de treino (18)</option>
        <option value="novo">Perguntas novas (15)</option>
        <option value="all">Todas (33)</option>
      </select>
    </label>
    <label><input type="checkbox" id="f-hide"> Esconder soluções (modo estudo)</label>
  </div>
  <div id="corr-list"></div>
</section>

<section class="tab" id="tab-teste">
  <div id="t-resume"></div>
  <div id="t-setup" class="card">
    <h2 style="margin-top:0;font-size:1.15rem">Configurar teste</h2>
    <div class="form">
      <label>Perguntas
        <select id="t-pool">
          <option value="orig">As 18 do teste de treino</option>
          <option value="novo">As 15 perguntas novas</option>
          <option value="mix">18 aleatórias (de todas)</option>
          <option value="all">Todas (33)</option>
        </select>
      </label>
      <label>Desconto por resposta errada
        <select id="t-pen">
          <option value="0">Sem desconto</option>
          <option value="0.25" selected>−0,25 por errada</option>
          <option value="0.3333">−1/3 por errada</option>
          <option value="0.5">−0,5 por errada</option>
        </select>
        <span class="note">Não sei qual é o desconto que o teu professor aplica — ajusta aqui. “Não responder” vale sempre 0.</span>
      </label>
      <label>Tempo limite (minutos, 0 = sem limite)
        <input type="number" id="t-mins" min="0" max="300" value="0">
      </label>
      <label class="row"><input type="checkbox" id="t-shufq" checked> Baralhar a ordem das perguntas</label>
      <label class="row"><input type="checkbox" id="t-shufo" checked> Baralhar a ordem das opções</label>
      <div><button class="btn" id="t-start" type="button">Começar teste</button></div>
    </div>
  </div>
  <div id="t-run" hidden></div>
  <div id="t-result" hidden></div>
</section>

<section class="tab cab" id="tab-cabula"></section>

<section class="tab" id="tab-historico">
  <div id="hist"></div>
</section>
</div>

<script>
"use strict";
const C = String.raw;

/* ============================================================
   PERGUNTAS
   ops: [texto, correta?, porquê]
   ============================================================ */

const DECL_IMOVEL = C`#define MAX_IMOVEIS 1000

typedef struct{
        /* Campos da estrutura */
}tipoImovel;`;

const DECL_IMOVEL_DATA = C`typedef struct{
    int dia;
    int mes;
    int ano;
}tipoData;

typedef struct{
    char designacao[50];
    tipoData dataVenda;
    float precoVenda;
}tipoImovel;`;

const OPTS_F = [
  "vetor[1].x=-2  vetor[1].y=3.00",
  "vetor[1].x=-2  vetor[4].y=4.50",
  "vetor[1].x=0  vetor[3].y=0.00",
  "vetor[1].x=-2  vetor[3].y=4.00"
];

const QS = [
/* ---------------- 1 ---------------- */
{ id:"O1", src:"orig", label:"Pergunta 1", tema:"Vetores e funções",
  txt:"Considere o seguinte programa codificado em linguagem C:",
  code:C`#include <stdio.h>
#define MAX 5
void funcao(int v[MAX], int n);

int main(void){
   int i, x, total;
   int vetor[MAX]={4,5,6,0,1};

   x = 2;
   funcao(vetor,x);

   total = 0;
   for (i=0; i<MAX; i++){
        total += vetor[i];
   }
   printf("\nmain()  total = %d", total);
   return 0;
}
void funcao(int v[MAX], int n){
    int j;

    for (j=1; j<=n; j++){
        v[j] = j-MAX;
    }
    printf("funcao() v[0]=%d  v[%d]=%d", v[0], j, v[j]);
}`,
  ask:"O resultado no monitor será o seguinte",
  ops:[
    [C`funcao() v[0]=-5  v[3]=0
main()  total = -11`, false, C`v[0] nunca é alterado: o ciclo começa em j=1.`],
    [C`funcao() v[0]=4  v[3]=0
main()  total = 16`, false, C`16 é a soma do vetor original. Mas os vetores são passados por referência, por isso as alterações feitas na função ficam no main.`],
    [C`funcao() v[0]=4  v[3]=0
main()  total = -2`, true, C`v[1]=-4, v[2]=-3; no fim do ciclo j=3; soma = 4-4-3+0+1 = -2.`],
    [C`funcao() v[0]=4  v[2]=-3
main()  total = -2`, false, C`Quando o ciclo <code>for</code> termina, j já vale 3 (é a condição <code>j&lt;=n</code> que falhou), logo imprime v[3].`]
  ],
  exp:C`<ol>
<li>x=2 é passado para n. Ciclo <code>j=1..2</code>: <code>v[1]=1-5=-4</code>, <code>v[2]=2-5=-3</code>.</li>
<li>O ciclo sai quando j=3. Imprime <code>v[0]=4</code> e <code>v[3]=0</code>.</li>
<li>O vetor é alterado “de verdade” (passagem por referência): {4,-4,-3,0,1} → total = <b>-2</b>.</li>
<li>Atenção ao <code>\n</code>: está no início do printf do main, por isso “main()” aparece na linha de baixo.</li></ol>`
},
/* ---------------- 2 ---------------- */
{ id:"O2", src:"orig", label:"Pergunta 2", tema:"Vetores e funções",
  txt:"Considere o seguinte programa codificado em linguagem C:",
  code:C`#include <stdio.h>

#define MAX 5
#define TRES 3
#define ZERO 0

void funcao(int v[MAX]);

int main(void){
   int i, conta;
   int vetor[MAX]={0};

   funcao(vetor);
   conta = 0;
   for (i=0; i<MAX; i++){
        if (vetor[i] % TRES == ZERO){
           conta++;
        }
   }
   printf("conta = %d", conta);

   return 0;
}

void funcao(int v[MAX]){
    int j;

    for (j=0; j<MAX; j++){
        v[j] = j+TRES;
    }
}`,
  ask:"O resultado no monitor será o seguinte",
  ops:[
    ["conta = 2", true, C`O vetor fica {3,4,5,6,7}; múltiplos de 3: 3 e 6.`],
    ["conta = 0", false, C`Isto seria se a função não alterasse o vetor — mas altera (vetores passam por referência).`],
    ["conta = 5", false, C`Seria se o vetor continuasse todo a 0 (0 % 3 == 0). Mas a função preenche-o.`],
    ["conta = 3", false, C`Só 3 e 6 são divisíveis por 3.`]
  ],
  exp:C`A função coloca <code>v[j]=j+3</code> → {3,4,5,6,7}. O main conta quantos têm resto 0 na divisão por 3: <b>3 e 6</b> → <code>conta = 2</code>.`
},
/* ---------------- 3 ---------------- */
{ id:"O3", src:"orig", label:"Pergunta 3", tema:"Strings",
  txt:"Considere o seguinte programa codificado em linguagem C:",
  code:C`#include <stdio.h>
#include <string.h>

#define MAX 10
#define TEXTO "teste"
#define CONST 7

void funcao(char v[MAX]);

int main(void){
   int i, conta;
   char vetor[MAX]={'\0'};

   funcao(vetor);
   conta = 0;
   for (i=0; i<=CONST; i++){
        if (vetor[i] != '\0'){
           conta++;
        }
   }
   printf("conta = %d", conta);

   return 0;
}
void funcao(char v[MAX]){
   strcpy(v,TEXTO);
}`,
  ask:"O resultado no monitor será o seguinte",
  ops:[
    ["conta = 0", false, C`O strcpy altera o vetor do main (é um vetor → passa por referência).`],
    ["conta = 10", false, C`Só as posições com letras são diferentes de '\0'.`],
    ["conta = 3", false, C`"teste" tem 5 letras.`],
    ["conta = 5", true, C`Posições 0–4 têm 't','e','s','t','e'; as restantes são '\0'.`]
  ],
  exp:C`O vetor começa todo a <code>'\0'</code>. O <code>strcpy</code> escreve "teste" nas posições 0–4 (e '\0' na 5). O ciclo vê as posições 0 a 7 (<code>i&lt;=7</code>) e conta as diferentes de '\0' → <b>5</b>.`
},
/* ---------------- 4 ---------------- */
{ id:"O4", src:"orig", label:"Pergunta 4", tema:"Estruturas e ponteiros",
  txt:"Considere o seguinte programa codificado em linguagem C:",
  code:C`#include <stdio.h>
#define MAX 16
#define TRES 3
#define NUMDECIMAL 0.425
#define QUATRO 4
typedef struct{
    int x;
    float y;
} tipoNumeros;
void g(tipoNumeros *a);
int main(void){
    tipoNumeros dados;

    dados.x = QUATRO;
    dados.y = NUMDECIMAL;
    g(&dados);
    printf(" main() x=%d  y=%.2f \n",  dados.x, dados.y);
    return 0;
}
void g(tipoNumeros *a){
    printf(" g() x=%d  y=%.2f \n",  a->x, a->y);
    a->x = MAX % TRES;
    a->y = MAX / TRES;
}`,
  ask:"O resultado no monitor será o seguinte",
  ops:[
    [C`g() x=4  y=0.42
main()  x=1  y=5.33`, false, C`16/3 entre inteiros dá 5 (não 5.33). E 0.425 aparece arredondado para 0.43.`],
    [C`g() x=4  y=0.43
main()  x=4  y=0.43`, false, C`A função recebe o endereço (&dados), por isso as alterações ficam no main.`],
    [C`g() x=4  y=0.425
main()  x=1  y=5.33`, false, C`<code>%.2f</code> mostra sempre 2 casas decimais; e 16/3 é divisão inteira.`],
    [C`g() x=4  y=0.43
main()  x=1  y=5.00`, true, C`16%3=1; 16/3=5 (inteiros) guardado num float → 5.00.`]
  ],
  exp:C`<ol>
<li>O printf de g() é feito <b>antes</b> das alterações: x=4, y=0.425 → com <code>%.2f</code> fica <b>0.43</b> (o float guarda 0.42500001…, que arredonda para cima).</li>
<li><code>MAX % TRES</code> = 16 % 3 = <b>1</b>.</li>
<li><code>MAX / TRES</code> = 16 / 3 — <b>os dois são int</b>, logo divisão inteira = 5. Só depois é guardado no float → <b>5.00</b>.</li>
<li>Como g recebe um ponteiro, as alterações ficam no main.</li></ol>`
},
/* ---------------- 5 ---------------- */
{ id:"O5", src:"orig", label:"Pergunta 5", tema:"Estruturas por valor",
  txt:"Considere o seguinte programa codificado em linguagem C:",
  code:C`#include <stdio.h>
#define VALOR 9.10
#define VIAGENS 10
typedef struct{
    int dias;
    float portagem;
} tipoTeste;
void g(tipoTeste a);
int main(void){
    tipoTeste dados;

    dados.dias = 2;
    dados.portagem = VALOR;
    g(dados);
    printf(" main() dias=%d  portagem=%.2f \n",  dados.dias, dados.portagem);

    return 0;
}
void g(tipoTeste a){
    a.dias = VIAGENS;
    a.portagem = VALOR*VIAGENS;
    printf(" g() dias=%d  portagem=%.2f \n",  a.dias, a.portagem);
}`,
  ask:"O resultado no monitor será o seguinte",
  ops:[
    [C`g() dias=10  portagem=91.0
main() dias=2  portagem=9.1`, false, C`<code>%.2f</code> mostra sempre 2 casas decimais: 91.00 e 9.10.`],
    [C`g() dias=10  portagem=91.00
main() dias=10  portagem=91.00`, false, C`A struct é passada por valor (cópia). O main não vê as alterações.`],
    [C`g() dias=10  portagem=91.00
main() dias=2  portagem=9.10`, true, C`g() mostra a cópia alterada; o main mantém os valores originais.`],
    [C`main() dias=2  portagem=9.10
g() dias=10  portagem=91.00`, false, C`A ordem está trocada: g() é chamada antes do printf do main.`]
  ],
  exp:C`<code>g(dados)</code> recebe uma <b>cópia</b> da struct (sem <code>*</code> nem <code>&amp;</code>). g() imprime primeiro (10 e 9.10×10=91.00); depois o main imprime os valores originais (2 e 9.10).`
},
/* ---------------- 6 ---------------- */
{ id:"O6", src:"orig", label:"Pergunta 6", tema:"Vetor de structs + ponteiro",
  txt:"Considere o seguinte programa codificado em linguagem C:",
  code:C`#include <stdio.h>
#define MAX 5
#define TRES 3
#define UM 1
#define MEIO 0.5

typedef struct{
    int x;
    float y;
} tipoTeste;

void f(tipoTeste v[MAX], int *c);

int main(void){
    int k;
    tipoTeste vetor[MAX]= {0};

    k = TRES;
    f(vetor, &k);
    printf("vetor[%d].x=%d  vetor[%d].y=%.2f", UM, vetor[UM].x, k, vetor[k].y);
    return 0;
}
void f(tipoTeste v[MAX], int *c){
    int i;

    for (i=0; i<MAX; i++){
        v[i].x = i - (*c);
        v[i].y = (i+MAX) * MEIO;
    }
    (*c)++;
}`,
  ask:"O resultado no monitor será o seguinte",

/* ============================================================

const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()){
    if (k === null || k === undefined || k === false) continue;
    e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return e;
}
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const byId = Object.fromEntries(QS.map(q => [q.id, q]));
const correctIdx = q => q.ops.findIndex(o => o[1]);
const LET = "abcdefgh";
const fmt = n => (Math.round(n*100)/100).toString().replace(".", ",");

/* ============================================================

   ============================================================ */
function qHead(q, label){
  return h("div", {class:"qhead"},
    h("span", {class:"qnum"}, label || q.label),
    h("span", {class:"chip"}, q.tema),
    q.src === "orig" ? h("span",{class:"chip chip-o"},"Teste de treino · P"+q.id.slice(1)) : h("span",{class:"chip chip-n"},"Nova"));
}
function qBody(q){
  return [
    h("p", {class:"qtxt", html:q.txt}),
    q.code ? h("pre", {class:"code"}, q.code) : null,
    q.ask ? h("p", {class:"qask", html:q.ask}) : null
  ];
}
/* opts: {hide, order, chosen, label} */
function solutionCard(q, opts={}){
  const order = opts.order || q.ops.map((_,i)=>i);
  const card = h("article", {class:"card" + (opts.hide ? " hidden-sol" : "")});
  card.append(qHead(q, opts.label), ...qBody(q));
  const ol = h("ol", {class:"opts"});
  order.forEach((oi, pos) => {
    const o = q.ops[oi];
    let cls = "opt " + (o[1] ? "ok" : "bad");
    if (opts.chosen === oi && !o[1]) cls += " chosen-bad";
    ol.append(h("li", {class:cls},
      h("span", {class:"letter"}, LET[pos]),
      h("div", {class:"optbody"},
        h("pre", {class:"opttxt"}, o[0]),
        opts.chosen === oi ? h("span",{class:"tag mine"},"a tua resposta") : null,
        h("div", {class:"why", html:(o[1] ? "✔ Correta. " : "✘ ") + o[2]}))));
  });
  if (opts.chosen === -1 || opts.chosen === null && opts.review){
    card.append(h("p", {class:"note"}, opts.chosen === -1 ? "Escolheste “Não responder”." : "Não respondeste."));
  }
  card.append(ol);
  card.append(h("div", {class:"exp", html:"<strong>Explicação</strong>" + q.exp}));
  if (opts.hide) card.append(h("button", {class:"btn ghost reveal", type:"button", onclick:()=>card.classList.remove("hidden-sol")}, "Ver solução"));
  return card;
}

/* ============================================================
   TESTE
   ============================================================ */
let T = null, timerId = null;
const POOL_NAMES = {orig:"Teste de treino (18)", novo:"Perguntas novas (15)", mix:"18 aleatórias", all:"Todas (33)"};

function saveT(){ if (T) store.set("prog1_cur", T); }

function startTest(){
  const pool = $("#t-pool").value;
  let qs;
  if (pool === "orig") qs = QS.filter(q => q.src === "orig");
  else if (pool === "novo") qs = QS.filter(q => q.src === "novo");
  else if (pool === "mix") qs = shuffle(QS.slice()).slice(0, 18);
  else qs = QS.slice();
  if ($("#t-shufq").checked) qs = shuffle(qs.slice());
  const shufo = $("#t-shufo").checked;
  T = {
    pool,
    ids: qs.map(q => q.id),
    ord: qs.map(q => shufo ? shuffle(q.ops.map((_,i)=>i)) : q.ops.map((_,i)=>i)),
    ans: qs.map(() => null),
    cur: 0,
    pen: parseFloat($("#t-pen").value) || 0,
    mins: Math.max(0, parseInt($("#t-mins").value, 10) || 0),
    start: Date.now()
  };
  saveT();
  runTest();
}
$("#t-start").addEventListener("click", startTest);

function runTest(){
  $("#t-setup").hidden = true; $("#t-result").hidden = true; $("#t-resume").textContent = "";
  $("#t-run").hidden = false;
  clearInterval(timerId);
  timerId = setInterval(tick, 1000);
  renderQ();
}

function remaining(){ return T.mins ? T.mins*60 - Math.floor((Date.now()-T.start)/1000) : null; }
function elapsed(){ return Math.floor((Date.now()-T.start)/1000); }
function mmss(s){ s = Math.max(0, s); const m = Math.floor(s/60), r = s%60; return m + ":" + String(r).padStart(2,"0"); }
function tick(){
  if (!T) return;
  const el = $("#timer"); if (!el) return;
  if (T.mins){
    const r = remaining();
    el.textContent = "Tempo restante " + mmss(r);
    el.classList.toggle("low", r <= 300);
    if (r <= 0){ finishTest(true); }
  } else {
    el.textContent = "Tempo " + mmss(elapsed());
  }
}

function renderQ(){
  const run = $("#t-run"); run.textContent = "";
  const n = T.ids.length, i = T.cur, q = byId[T.ids[i]];
  const answered = T.ans.filter(a => a !== null).length;

  run.append(h("div", {class:"runbar"},
    h("strong", {}, `Pergunta ${i+1} de ${n}`),
    h("span", {class:"timer", id:"timer"}, ""),
    h("button", {class:"btn ghost", type:"button", onclick:()=>{
      const falta = n - answered;
      if (confirm(falta ? `Ainda tens ${falta} pergunta(s) sem resposta (contam como não respondidas). Terminar?` : "Terminar o teste?")) finishTest(false);
    }}, "Terminar teste")));

  const card = h("article", {class:"card"});
  card.append(qHead(q, `Pergunta ${i+1}`), ...qBody(q));
  const box = h("div", {class:"opts", style:"display:grid;gap:8px"});
  const mk = (val, content, mono) => {
    const sel = T.ans[i] === val;
    const inp = h("input", {type:"radio", name:"r", checked:sel});
    inp.addEventListener("change", () => { T.ans[i] = val; saveT(); renderQ(); });
    return h("label", {class:"ans" + (sel ? " sel" : "")}, inp,
      mono ? h("pre", {class:"opttxt"}, content) : h("span", {}, content));
  };
  T.ord[i].forEach((oi, pos) => box.append(mk(oi, q.ops[oi][0], true)));
  box.append(mk(-1, "NÃO RESPONDER", true));
  card.append(box);
  if (T.ans[i] !== null){
    card.append(h("div", {style:"margin-top:8px"},
      h("button", {class:"btn ghost", type:"button", onclick:()=>{ T.ans[i] = null; saveT(); renderQ(); }}, "Limpar escolha")));
  }
  run.append(card);

  run.append(h("div", {class:"navrow"},
    h("button", {class:"btn ghost", type:"button", disabled:i===0, onclick:()=>go(i-1)}, "← Anterior"),
    i < n-1 ? h("button", {class:"btn", type:"button", onclick:()=>go(i+1)}, "Seguinte →")
            : h("button", {class:"btn", type:"button", onclick:()=>{ if (confirm("Terminar o teste?")) finishTest(false); }}, "Terminar")));

  const grid = h("div", {class:"grid"});
  T.ids.forEach((_, k) => grid.append(h("button", {
    type:"button", class:(T.ans[k] !== null ? "done" : "") + (k === i ? " cur" : ""),
    title: T.ans[k] === null ? "Sem resposta" : (T.ans[k] === -1 ? "Não responder" : "Respondida"),
    onclick:()=>go(k)}, k+1)));
  run.append(h("div", {class:"card"}, h("div", {class:"note"}, `Navegação · ${answered}/${n} respondidas`), grid));
  tick();
}
function go(k){ T.cur = k; saveT(); renderQ(); window.scrollTo(0,0); }

document.addEventListener("keydown", e => {
  if (!T || $("#t-run").hidden || !$("#tab-teste").classList.contains("on")) return;
  if (e.target.matches("input[type=number],select,textarea")) return;
  if (e.key === "ArrowRight" && T.cur < T.ids.length-1) go(T.cur+1);
  else if (e.key === "ArrowLeft" && T.cur > 0) go(T.cur-1);
  else if (/^[1-4]$/.test(e.key)){ const oi = T.ord[T.cur][+e.key-1]; if (oi !== undefined){ T.ans[T.cur] = oi; saveT(); renderQ(); } }
  else if (e.key === "0"){ T.ans[T.cur] = -1; saveT(); renderQ(); }
});

function grade(t){
  let ok=0, bad=0, nr=0;
  const st = t.ids.map((id, k) => {
    const a = t.ans[k], q = byId[id];
    if (a === null || a === -1){ nr++; return "nr"; }
    if (a === correctIdx(q)){ ok++; return "ok"; }
    bad++; return "bad";
  });
  const pts = ok - t.pen*bad;
  const nota = Math.max(0, pts) / t.ids.length * 20;
  return {ok, bad, nr, pts, nota, st};
}

function finishTest(timeUp){
  clearInterval(timerId);
  const g = grade(T);
  const hist = store.get("prog1_hist", []);
  hist.unshift({d:Date.now(), pool:T.pool, n:T.ids.length, ok:g.ok, bad:g.bad, nr:g.nr, pen:T.pen, nota:g.nota, dur:elapsed()});
  store.set("prog1_hist", hist.slice(0, 100));
  store.del("prog1_cur");
  showResult(T, g, timeUp);
}

function showResult(t, g, timeUp){
  $("#t-run").hidden = true; $("#t-setup").hidden = true;
  const res = $("#t-result"); res.hidden = false; res.textContent = "";
  if (timeUp) res.append(h("div", {class:"banner"}, "⏰ O tempo acabou — o teste foi entregue automaticamente."));
  res.append(h("div", {class:"card"},
    h("h2", {style:"margin:0 0 4px;font-size:1.2rem"}, "Resultado"),
    h("div", {class:"note"}, `${POOL_NAMES[t.pool]} · desconto por errada: ${t.pen ? "−"+fmt(t.pen) : "nenhum"} · duração ${mmss(Math.floor((Date.now()-t.start)/1000))}`),
    h("div", {class:"stats"},
      h("div", {class:"stat"}, h("div",{class:"v"}, fmt(g.nota)), h("div",{class:"l"},"Nota (0–20)")),
      h("div", {class:"stat"}, h("div",{class:"v"}, fmt(g.pts)+" / "+t.ids.length), h("div",{class:"l"},"Pontos")),
      h("div", {class:"stat ok"}, h("div",{class:"v"}, g.ok), h("div",{class:"l"},"Certas")),
      h("div", {class:"stat bad"}, h("div",{class:"v"}, g.bad), h("div",{class:"l"},"Erradas")),
      h("div", {class:"stat"}, h("div",{class:"v"}, g.nr), h("div",{class:"l"},"Não respondidas"))),
    (() => { const gr = h("div", {class:"grid"});
      t.ids.forEach((_, k) => gr.append(h("button", {type:"button", class:g.st[k]==="ok"?"ok":g.st[k]==="bad"?"bad":"",
        onclick:()=>{ const el = document.getElementById("rev-"+k); if (el) el.scrollIntoView({behavior:"smooth"}); }}, k+1)));
      return gr; })(),
    h("div", {style:"display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"},
      h("button", {class:"btn", type:"button", onclick:newTest}, "Novo teste"),
      h("button", {class:"btn ghost", type:"button", onclick:() => {
        const pool = t.ids.filter((_,k) => g.st[k] !== "ok");
        if (!pool.length){ alert("Acertaste tudo — não há nada para repetir!"); return; }
        T = {pool:t.pool, ids:shuffle(pool.slice()), ord:null, ans:null, cur:0, pen:t.pen, mins:0, start:Date.now()};
        T.ord = T.ids.map(id => shuffle(byId[id].ops.map((_,i)=>i)));
        T.ans = T.ids.map(() => null);
        saveT(); runTest();
      }}, "Repetir só as que falhei"))));

  const filt = h("label", {class:"note", style:"display:flex;gap:6px;align-items:center;margin:4px 0 12px"},
    h("input", {type:"checkbox", id:"onlyBad"}), "Mostrar só erradas e não respondidas");
  res.append(filt);
  const list = h("div", {});
  const draw = () => {
    list.textContent = "";
    const only = $("#onlyBad").checked;
    t.ids.forEach((id, k) => {
      if (only && g.st[k] === "ok") return;
      const icon = g.st[k] === "ok" ? "✔ " : g.st[k] === "bad" ? "✘ " : "– ";
      const c = solutionCard(byId[id], {order:t.ord[k], chosen:t.ans[k], review:true, label: icon + "Pergunta " + (k+1)});
      c.id = "rev-"+k;
      list.append(c);
    });
  };
  res.append(list);
  $("#onlyBad").addEventListener("change", draw);
  draw();
  window.scrollTo(0,0);
}

function newTest(){
  T = null; clearInterval(timerId);
  $("#t-result").hidden = true; $("#t-run").hidden = true; $("#t-setup").hidden = false;
  checkResume();
  window.scrollTo(0,0);
}

function checkResume(){
  const box = $("#t-resume"); box.textContent = "";
  const cur = store.get("prog1_cur", null);
  if (!cur || !cur.ids || T) return;
  const ans = cur.ans.filter(a => a !== null).length;
  box.append(h("div", {class:"banner"},
    h("span", {}, `Tens um teste a meio (${ans}/${cur.ids.length} respondidas).`),
    h("button", {class:"btn", type:"button", onclick:()=>{ T = cur; runTest(); }}, "Continuar"),
    h("button", {class:"btn danger", type:"button", onclick:()=>{ store.del("prog1_cur"); box.textContent = ""; }}, "Descartar")));
}

/* ============================================================
   HISTÓRICO
   ============================================================ */
function renderHist(){
  const box = $("#hist"); box.textContent = "";
  const hist = store.get("prog1_hist", []);
  if (!hist.length){
    box.append(h("div", {class:"card"}, h("p", {style:"margin:0"}, "Ainda não fizeste nenhum teste. Os resultados ficam guardados neste browser.")));
    return;
  }
  const tb = h("tbody", {});
  hist.forEach(r => tb.append(h("tr", {},
    h("td", {}, new Date(r.d).toLocaleString("pt-PT", {dateStyle:"short", timeStyle:"short"})),
    h("td", {}, POOL_NAMES[r.pool] || r.pool),
    h("td", {}, r.ok), h("td", {}, r.bad), h("td", {}, r.nr),
    h("td", {}, h("strong", {}, fmt(r.nota))),
    h("td", {}, mmss(r.dur)))));
  box.append(h("div", {class:"card"},
    h("div", {class:"tablewrap"}, h("table", {},
      h("thead", {}, h("tr", {}, ["Data","Perguntas","Certas","Erradas","N/R","Nota","Tempo"].map(x => h("th", {}, x)))),
      tb)),
    h("div", {style:"margin-top:12px"},
      h("button", {class:"btn danger", type:"button", onclick:()=>{ if (confirm("Apagar todo o histórico?")){ store.del("prog1_hist"); renderHist(); } }}, "Apagar histórico"))));
}

/* ============================================================
   CÁBULA
   ============================================================ */
const CABULA = [
["1. Passagem de parâmetros (a pergunta mais repetida!)", C`<ul>
<li><b>int, float, struct</b> passados normalmente → <b>cópia</b>. Alterações dentro da função <b>perdem-se</b> (P5, P7).</li>
<li><b>Vetores</b> (incluindo strings) → passam sempre o endereço. Alterações <b>ficam</b> no main (P1, P2, P3).</li>
<li><b>Ponteiro</b> (<code>f(&amp;k)</code> + <code>int *c</code>) → alterações com <code>*c</code> ou <code>-&gt;</code> <b>ficam</b> (P4, P6).</li>
<li><b>return</b> só altera se o main guardar: <code>k = f(v,k);</code> muda k; <code>f(v,k);</code> não muda (P8 vs Extra 7).</li></ul>`],
["2. Ponto vs seta", C`<ul>
<li>Variável struct: <code>dados.campo</code></li>
<li>Ponteiro para struct: <code>dados-&gt;campo</code> ≡ <code>(*dados).campo</code></li>
<li><code>*dados.campo</code> está <b>errado</b> (o ponto tem prioridade sobre <code>*</code>).</li>
<li>Vetor de structs: <code>vetor[i].campo</code>; endereço de um elemento: <code>&amp;vetor[i]</code>.</li>
<li>Endereço de um campo através de ponteiro: <code>&amp;dados-&gt;dataVenda</code>.</li></ul>`],
["3. Ponteiros para int", C`Com <code>int *q</code>:<ul>
<li><code>q</code> = endereço · <code>*q</code> = valor · <code>&amp;(*q)</code> = <code>q</code></li>
<li><code>*q = 0;</code> põe o valor a 0 ✔ — <code>q = 0;</code> estraga o ponteiro ✘</li>
<li><code>&amp;q</code> é o endereço do ponteiro (quase sempre errado em fread).</li></ul>`],
["4. Contas e printf", C`<ul>
<li><code>int / int</code> = divisão inteira: 16/3 = 5. Guardar num float não recupera: dá 5.00.</li>
<li>Para divisão real: <code>(float)a / b</code> ou usar um literal decimal.</li>
<li><code>%</code> = resto: 16 % 3 = 1, 23 % 5 = 3.</li>
<li><code>%.2f</code> mostra <b>sempre</b> 2 casas e arredonda: 9.1 → 9.10, 0.425 → 0.43, 91 → 91.00.</li>
<li>Ordem do output = ordem das chamadas a printf (atenção a quem imprime primeiro!).</li>
<li>Repara onde está o <code>\n</code> (no início ou no fim) para saber onde quebra a linha.</li></ul>`],
["5. Ciclos e strings", C`<ul>
<li>Depois de <code>for (j=1; j&lt;=n; j++)</code>, j vale <b>n+1</b> (P1: j=3).</li>
<li><code>char v[10] = {'\0'};</code> → todas as posições a '\0'.</li>
<li><code>strcpy(v, "teste")</code> escreve 5 letras + '\0'; <code>strcat</code> junta no fim.</li>
<li>Listar/ler: ciclo até <b>quantidade</b>, nunca até MAX.</li></ul>`],
["6. Funções de leitura (P10, P11, P14, P15)", C`Olha <b>sempre</b> para o protótipo:<ul>
<li><code>tipoX lerX(void)</code> → <code>var = lerX();</code></li>
<li><code>void lerX(tipoX *p)</code> → <code>lerX(&amp;var);</code></li>
<li><code>tipoImovel obtemImovel(void)</code> → <code>vetor[i] = obtemImovel();</code></li>
<li><code>void obtemImovel(tipoImovel *d)</code> → <code>obtemImovel(&amp;vetor[i]);</code></li>
<li>Função que “obtém e devolve” com parâmetro <b>sem *</b> e tipo void → está errada (cópia perde-se).</li>
<li>Strings (<code>char nome[50]</code>) passam-se sem &amp;: <code>lerString(d-&gt;nome, 50)</code>.</li></ul>`],
["7. Ficheiros binários (P16–P18)", C`<pre class="code">FILE *fp;
fp = fopen("FICH.DAT", "wb");        /* gravar: "wb" | ler: "rb" | acrescentar: "ab" */
if (fp != NULL) {                    /* != NULL, nunca == NULL */
    fwrite(&amp;quant, sizeof(int), 1, fp);       /* &amp; no int */
    fwrite(vetor, sizeof(tipoX), quant, fp);     /* vetor sem & */
    fclose(fp);
}</pre>
<ul><li>fread/fwrite(<b>endereço</b>, <b>tamanho de 1 elemento</b>, <b>quantos</b>, fp).</li>
<li>"r"/"w" sem b = modo texto → errado para binário.</li>
<li>Ler pela <b>mesma ordem</b> em que se gravou (quantidade primeiro).</li>
<li>A quantidade lida devolve-se com <code>return</code> (função int) <b>ou</b> por ponteiro <code>int *q</code> com <code>*q</code>.</li></ul>`],
["8. Declarar estruturas (P12)", C`<ul>
<li>Data → struct própria <code>tipoData {dia, mes, ano}</code> (um mês só, não <code>mes[12]</code>).</li>
<li>Texto → <code>char nome[N]</code> (não <code>char nome;</code>).</li>
<li>No main: <code>tipoX vetor[MAX];</code> e contador <code>int quant = 0;</code></li></ul>`],
["9. Estratégia para o “NÃO RESPONDER”", C`<ul>
<li>Se há desconto por resposta errada, só “chutas” quando consegues eliminar pelo menos 2 opções.</li>
<li>Nas perguntas de código, elimina primeiro pelos detalhes fáceis: modo "r"/"w" sem b, <code>== NULL</code>, <code>.</code> com ponteiro, <code>-&gt;</code> sem ponteiro, falta de &amp;.</li>
<li>Nas de output, faz a tabela das variáveis à mão — e confirma se a função altera ou não o original.</li></ul>`]
];
